<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" fill="none" role="img" aria-label="Line drawing of a bond certificate with a coupon schedule">
  <!-- offset pastel shape, sits behind the line work -->
  <circle cx="296" cy="104" r="78" fill="#FBF3DB"/>
  <g stroke="#2F3437" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- certificate sheet, drawn as one continuous contour -->
    <path d="M74 52c38-5 77-6 115-3 11 1 22 2 33 1 6 0 12-1 18 1 3 1 4 4 4 7 1 47 1 94 0 141 0 8 0 16-2 24-1 4-5 6-9 6-53 2-106 2-159 0-5 0-9-3-9-8-2-40-2-81-1-121 0-15 1-30 2-45 0-2 2-3 8-3Z"/>
    <!-- fold, deliberately not parallel to the edge -->
    <path d="M78 222c51-3 103-3 154 0"/>
    <!-- ruled lines, hand-drawn wobble -->
    <path d="M104 92c37-3 74-4 111-2"/>
    <path d="M104 118c29-2 58-3 87-2"/>
    <path d="M104 144c45-3 90-3 135 0"/>
    <path d="M104 170c22-1 44-2 66-1"/>
    <!-- coupon ticks along the bottom: the payout schedule -->
    <path d="M104 250v20M132 250v20M160 250v20M188 250v20M216 250v20"/>
    <path d="M96 250c46-4 92-4 138 0"/>
    <!-- seal, one closed loop plus a tail -->
    <path d="M262 214c-17 0-31 13-31 30s14 30 31 30 31-13 31-30c0-12-7-23-18-27"/>
    <path d="M250 262l-9 32 15-9 14 11-6-32"/>
    <!-- pen stroke leaving the sheet -->
    <path d="M300 52c14 11 27 24 38 39 3 4 5 9 4 14"/>
  </g>
</svg>
