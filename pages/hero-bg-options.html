<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Background Options</title>
<!-- Picker for home-premium22's hero background. Each option is the real page
     loaded with ?bg=<name>; the chosen one becomes the page's default. -->
<link rel="icon" href="../assets/img/goldenpi-logo.svg">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { --gold: #edc967; --line: rgba(212, 175, 55, 0.18); --dim: rgba(255, 255, 255, 0.62); --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
  html, body { margin: 0; height: 100%; }
  body { background: #0a0907; color: #fff; font-family: "Satoshi", ui-sans-serif, system-ui, sans-serif; display: grid; grid-template-columns: 340px 1fr; }
  aside { padding: 28px 20px; border-right: 1px solid var(--line); overflow-y: auto; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; }
  aside > p { margin: 8px 0 22px; font-size: 14px; line-height: 1.5; color: var(--dim); }
  .opts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .opt { width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: #14110c; color: #fff; font: inherit; cursor: pointer;
    transition: border-color 200ms ease, background-color 200ms ease, transform 160ms var(--ease-out); }
  .opt:active { transform: scale(0.98); }
  .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .opt:hover { border-color: rgba(237, 201, 103, 0.45); } }
  .opt[aria-pressed="true"] { border-color: var(--gold); background: #1d180f; }
  .opt b { display: flex; justify-content: space-between; font-size: 16px; }
  .opt b small { font-weight: 500; font-size: 12px; color: var(--gold); }
  .opt span { display: block; margin-top: 4px; font-size: 13px; line-height: 1.45; color: var(--dim); }
  .open { display: inline-block; margin-top: 18px; color: var(--gold); font-size: 14px; }
  main { position: relative; min-width: 0; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    aside > p { margin-bottom: 12px; }
    .opts { grid-auto-flow: column; grid-auto-columns: 78%; overflow-x: auto; scroll-snap-type: x mandatory; }
    .opts li { scroll-snap-align: start; }
    main { min-height: 70vh; }
  }
</style>
</head>
<body>
<aside>
  <h1>Hero background</h1>
  <p>Each option is home-premium22 itself. Pick one, move the pointer over the hero, then tell Claude the name to make it final.</p>
  <ul class="opts">
    <li><button class="opt" type="button" data-bg="glow"><b>glow <small>current</small></b><span>A soft gold light breathing behind the headline. CSS, cheapest.</span></button></li>
    <li><button class="opt" type="button" data-bg="bubble"><b>bubble <small>CSS</small></b><span>A glass orb breathing behind the headline, a few small bubbles rising.</span></button></li>
    <li><button class="opt" type="button" data-bg="aurora"><b>aurora <small>CSS</small></b><span>Soft gold ribbons of light swaying along the top.</span></button></li>
    <li><button class="opt" type="button" data-bg="flames"><b>flames <small>CSS</small></b><span>Low candle-light tongues flickering gently behind the figures.</span></button></li>
    <li><button class="opt" type="button" data-bg="waves"><b>waves <small>SVG</small></b><span>Three thin gold lines rolling slowly across the lower hero.</span></button></li>
    <li><button class="opt" type="button" data-bg="stardust"><b>stardust <small>canvas</small></b><span>Fine gold points twinkling and drifting up, very sparse.</span></button></li>
  </ul>
  <a class="open" id="open" href="home-premium22.html?bg=glow" target="_blank" rel="noopener">Open this option full page</a>
</aside>
<main>
  <iframe id="view" title="home-premium22 preview" src="home-premium22.html?bg=glow"></iframe>
</main>
<script>
(function () {
  var view = document.getElementById('view'), open = document.getElementById('open'), btns = document.querySelectorAll('.opt');
  function pick(name) {
    btns.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.bg === name ? 'true' : 'false'); });
    var url = 'home-premium22.html?bg=' + name;
    if (view.getAttribute('src') !== url) view.src = url;
    open.href = url;
    history.replaceState(null, '', '#' + name);
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { pick(b.dataset.bg); }); });
  var start = location.hash.slice(1);
  pick(document.querySelector('.opt[data-bg="' + start + '"]') ? start : 'glow');
})();
</script>
</body>
</html>
