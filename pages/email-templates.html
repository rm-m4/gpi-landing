<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email templates, header and footer | GoldenPi</title>
<!-- Header and footer options for GoldenPi's transactional emails (the EJS
     partials common/header-ipo, common/logo, common/footer, common/partnership).
     The email body is the current OTP mail and is not redesigned. Footer copy is
     from a screenshot of the live mail, saved in content/email-footer.md. Each
     option renders email-safe HTML (tables, inline styles, bgcolor fallbacks)
     into an iframe; "Copy email HTML" hands that markup to the dev. -->
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/goldenpi-logo.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<style>
  :root { --ink:#322811; --sub:#666; --gold:#d4af37; --bronze:#8a6520; --bg:#f7f5f2; --line:#e7e3d9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Satoshi, Helvetica, Arial, sans-serif; }
  header { max-width:1100px; margin:0 auto; padding:28px 16px 8px; }
  h1 { font-size:26px; font-weight:900; letter-spacing:-0.02em; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); max-width:70ch; }
  .bar { position:sticky; top:0; z-index:1; background:var(--bg); border-bottom:1px solid var(--line); }
  .bar div { max-width:1100px; margin:0 auto; padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 14px; border-radius:999px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  button:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .sp { flex:1; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns:280px 1fr; gap:24px; align-items:start; }
  aside h2 { font-size:18px; margin:0 0 6px; }
  aside p { margin:0 0 12px; color:var(--sub); font-size:14px; }
  aside code { display:block; white-space:pre-wrap; font-size:12px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--ink); }
  .frame { display:flex; justify-content:center; background:#e9e6e0; border-radius:12px; padding:24px 0; }
  iframe { border:0; width:640px; max-width:100%; height:1200px; background:#fff; box-shadow:0 8px 30px rgba(50,40,17,.12); transition:width .25s; }
  iframe.mobile { width:375px; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } .frame { padding:0; } }
</style>
</head>
<body>
<header>
  <h1>Transactional email: header and footer options</h1>
  <p><a href="all-pages.html" style="color:var(--bronze)">All pages</a></p>
  <p>The body content is unchanged (the OTP mail from the current screenshot). Only the header and footer partials change. Pick one and send its CSS to the dev.</p>
</header>
<div class="bar"><div id="tabs"></div><div style="padding-top:0"><span class="sp"></span>
  <button id="desk" aria-pressed="true">Desktop</button><button id="mob" aria-pressed="false">Mobile</button>
  <button id="copy">Copy email HTML</button></div></div>
<main>
  <aside><h2 id="name"></h2><p id="why"></p><code id="css"></code></aside>
  <div class="frame"><iframe id="f" title="Email preview"></iframe></div>
</main>

<script>
// Assets: logo + icon supplied by GoldenPi; partner logos from their CloudFront.
const LOGO = 'https://s3.ap-south-1.amazonaws.com/static.webhost.goldenpi/emailImages/goldenpi_logo.png';
const ICON = 'https://s3.ap-south-1.amazonaws.com/static.webhost.goldenpi/emailImages/email-page-icon.png';
const PARTNERS = [
  ['https://d2tfvseypdp8pf.cloudfront.net/assets/img/AxisSecurities.png','Axis Securities'],
  ['https://d2tfvseypdp8pf.cloudfront.net/assets/img/AnandRathi.webp','Anand Rathi'],
  ['https://d2tfvseypdp8pf.cloudfront.net/assets/img/Sakthi-Finance-logo.png','Sakthi Finance'],
  ['https://d2tfvseypdp8pf.cloudfront.net/assets/img/centrum.png','Centrum'],
];
// ponytail: Tabler SVGs recoloured into data URIs for preview only; production footer keeps its own PNG icons + hrefs
const SOCIAL = ['facebook','x','linkedin','instagram','youtube'], SVG = {};
const social = (color, size=20) => SOCIAL.map(s =>
  `<a href="#" style="display:inline-block;margin:0 0 0 18px;"><img src="data:image/svg+xml,${encodeURIComponent((SVG[s]||'').replace(/currentColor/g,'#'+color))}" width="${size}" height="${size}" alt="${s}" style="display:block;border:0;"></a>`).join('');

const F = 'font-family:Helvetica,Arial,sans-serif;';
const wrap = (bg, inner) => `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>@media (max-width:480px){.px{padding-left:20px!important;padding-right:20px!important}.hide-m{display:none!important}.stack>tbody>tr>td{display:block!important;width:100%!important;text-align:left!important;padding-top:8px!important}.stack a:first-child{margin-left:0!important}}</style></head>
<body style="margin:0;padding:0;background:${bg};"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="${bg}" style="background:${bg};"><tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">${inner}</table></td></tr></table></body></html>`;

// The unchanged middle: copy from the current OTP mail.
const BODY = `<tr><td class="px" bgcolor="#ffffff" style="background:#ffffff;padding:48px 44px 40px;${F}color:#222222;">
<p style="margin:0 0 20px;font-size:20px;font-weight:700;">Dear Customer,</p>
<p style="margin:0 0 48px;font-size:18px;line-height:1.56;">Please enter this OTP: <b>799754</b> to login to your account.</p>
<p style="margin:0;font-size:17px;line-height:2;">Best Regards,<br>Team GoldenPi</p></td></tr>`;

const partners = (label, labelColor, rule, chip='') => `<tr><td style="padding:36px 20px 8px;${F}font-size:15px;color:${labelColor};text-align:center;letter-spacing:.02em;">${label}</td></tr>
<tr><td align="center" style="padding:10px 10px 28px;font-size:0;${rule}">${
  PARTNERS.map(([s,a]) => `<span style="display:inline-block;margin:6px 12px;${chip}"><img src="${s}" alt="${a}" height="26" style="display:block;height:26px;width:auto;border:0;"></span>`).join('')
}</td></tr>`;

const legal = (c, link) => `<tr><td class="px" style="padding:24px 28px 8px;${F}font-size:12.5px;line-height:1.7;color:${c};text-align:center;">
<b style="color:inherit;">GoldenPi Securities Pvt Ltd</b><br>
SEBI Registration No: INZ000310732, BSE Member ID: 6809<br>
Indiqube Orion, 24th Main, 1st Sector, HSR Layout, Bangalore South, Bangalore, Karnataka - 560102<br>
Compliance Officer: Kunal Sharma, Tel No: 080-45685666, Email ID: <a href="#" style="color:${link};text-decoration:none;">grievance-gspl@goldenpi.com</a> (for any of your grievance)</td></tr>
<tr><td style="padding:10px 20px;${F}font-size:13px;text-align:center;">
<a href="#" style="color:${link};text-decoration:none;">About Us</a> <span style="color:${c};">&nbsp;|&nbsp;</span>
<a href="#" style="color:${link};text-decoration:none;">Terms &amp; Conditions</a> <span style="color:${c};">&nbsp;|&nbsp;</span>
<a href="#" style="color:${link};text-decoration:none;">Privacy Policy</a></td></tr>
<tr><td class="px" style="padding:6px 28px 26px;${F}font-size:12px;line-height:1.7;color:${c};text-align:center;">
This is an auto-generated email. You received this email because you are subscribed to GoldenPi.<br>
Need assistance? visit our <a href="#" style="color:${link};text-decoration:none;">help center</a>.</td></tr>`;

const strip = (bg, text, iconColor, radius='0 0 16px 16px') => `<tr><td bgcolor="${bg}" style="background:${bg};border-radius:${radius};padding:20px 24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="stack"><tr>
<td style="${F}font-size:14px;color:${text};">Stay updated with bonds &amp; fixed income investments</td>
<td align="right" style="padding-top:2px;white-space:nowrap;">${social(iconColor, 18)}</td></tr></table></td></tr>`;

// Shared pieces. Every gradient has a bgcolor fallback: Outlook desktop and
// some Gmail views drop background-image and show the flat colour instead.
const disc = (d, w, shadow = true) => `<table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#ffffff" width="${d}" height="${d}" align="center" valign="middle" style="background:#fff;border-radius:${d / 2}px;${shadow ? 'box-shadow:0 6px 18px rgba(138,101,32,.18);' : ''}">
<img src="${ICON}" alt="" width="${w}" style="display:block;border:0;"></td></tr></table>`;
const logoRow = `<tr><td style="padding:4px 8px 22px;"><img src="${LOGO}" alt="GoldenPi" width="170" style="display:block;border:0;"></td></tr>`;
const cardEnd = `<tr><td bgcolor="#ffffff" style="background:#fff;border-radius:0 0 16px 16px;height:16px;line-height:16px;font-size:0;">&nbsp;</td></tr>`;
const band = (bg, fallback, inner, extra = '') => `<tr><td class="px" bgcolor="${fallback}" style="background-color:${fallback};background-image:${bg};border-radius:16px 16px 0 0;${extra}">${inner}</td></tr>`;
const footInk = (bg = '#322811') => partners('In partnership with', '#666666', 'border-bottom:1px solid #e7e3d9;') + legal('#8a8478', '#8a6520') + strip(bg, '#ffffff', 'f4e9c8', '12px');
const footLight = (stripBg) => partners('In partnership with', '#666666', 'border-bottom:1px solid #e7e3d9;') + legal('#8a8478', '#8a6520') + strip(stripBg, '#322811', '8a6520', '12px');

const OPTIONS = [
{
  name: 'Champagne',
  why: 'Gold leaf two steps lighter. Same layout, but the band is a pale champagne sweep, so the white icon disc reads as a soft highlight instead of a hole. The ink footer strip anchors the lighter top.',
  css: `/* header band */\nbackground-color:#efdb9c;\nbackground-image:linear-gradient(280deg,#f8ecc4,#e8cd78);\n\n/* icon: white 104px disc */\n\n/* footer strip */\nbackground:#322811; color:#ffffff; icons:#f4e9c8;`,
  html: () => wrap('#f7f5f2', logoRow +
    band('linear-gradient(280deg,#f8ecc4,#e8cd78)', '#efdb9c', disc(104, 60), 'padding:34px 44px;height:116px;') +
    BODY + cardEnd + footInk())
},
{
  name: 'Gold wash',
  why: 'The band is light enough to hold the logo, so the logo moves inside the card and the separate logo row goes away. Gold fades top to bottom into the white body. Cream footer strip keeps the whole mail light.',
  css: `/* header band (holds the logo) */\nbackground-color:#f6e6b4;\nbackground-image:linear-gradient(180deg,#f0d88c 0%,#fbf3da 100%);\n\n/* icon: white 80px disc, right */\n\n/* footer strip */\nbackground:#f6ebc8; color:#322811; icons:#8a6520;`,
  html: () => wrap('#f7f5f2',
    band('linear-gradient(180deg,#f0d88c 0%,#fbf3da 100%)', '#f6e6b4', `<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
<td valign="middle"><img src="${LOGO}" alt="GoldenPi" width="160" style="display:block;border:0;"></td>
<td align="right" valign="middle">${disc(80, 46)}</td></tr></table>`, 'padding:36px 44px 40px;') +
    BODY + cardEnd + footLight('#f6ebc8'))
},
{
  name: 'Champagne, logo only',
  why: 'Champagne without the icon. The logo moves into the band, which is light enough for the grey wordmark, and the separate logo row goes away.',
  css: `/* header band (holds the logo) */\nbackground-color:#efdb9c;\nbackground-image:linear-gradient(280deg,#f8ecc4,#e8cd78);\npadding:40px 44px;\n\n/* footer strip */\nbackground:#322811; color:#ffffff;`,
  html: () => wrap('#f7f5f2',
    band('linear-gradient(280deg,#f8ecc4,#e8cd78)', '#efdb9c', `<img src="${LOGO}" alt="GoldenPi" width="170" style="display:block;border:0;">`, 'padding:40px 44px;') +
    BODY + cardEnd + footInk())
},
{
  name: 'Gold wash, logo only',
  why: 'Gold wash without the icon. The gold fades from the top into the white body, with nothing in the band but the logo. The lightest gold option; the header feels like the top of one continuous card.',
  css: `/* header band (holds the logo) */\nbackground-color:#f6e6b4;\nbackground-image:linear-gradient(180deg,#f0d88c 0%,#fbf3da 70%,#ffffff 100%);\npadding:44px 44px 28px;\n\n/* footer strip */\nbackground:#f6ebc8; color:#322811; icons:#8a6520;`,
  html: () => wrap('#f7f5f2',
    band('linear-gradient(180deg,#f0d88c 0%,#fbf3da 70%,#ffffff 100%)', '#f6e6b4', `<img src="${LOGO}" alt="GoldenPi" width="170" style="display:block;border:0;">`, 'padding:44px 44px 28px;') +
    BODY + cardEnd + footLight('#f6ebc8'))
},
{
  name: 'Ivory hairline',
  why: 'The quiet end of the range: no band at all. The logo sits inside the card, a 4px gold rule caps it, and the icon shrinks to a small cream badge. Fastest to load, most readable on phones and in dark-mode mail apps.',
  css: `/* card top */\nborder-top:4px solid #d4af37;\nbackground:#ffffff;\n\n/* icon badge */\nbackground:#f7f5f2; border-radius:50%;\n\n/* footer: no strip, social icons in #322811 */`,
  html: () => wrap('#f7f5f2', `
<tr><td bgcolor="#ffffff" style="background:#fff;border-top:4px solid #d4af37;border-radius:16px 16px 0 0;padding:32px 44px 0;" class="px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
<td valign="middle"><img src="${LOGO}" alt="GoldenPi" width="150" style="display:block;border:0;"></td>
<td align="right" valign="middle"><table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#f7f5f2" width="64" height="64" align="center" valign="middle" style="background:#f7f5f2;border-radius:32px;">
<img src="${ICON}" alt="" width="36" style="display:block;border:0;"></td></tr></table></td></tr></table>
<div style="height:1px;background:#e7e3d9;margin-top:28px;line-height:1px;font-size:0;">&nbsp;</div></td></tr>
${BODY.replace('padding:48px 44px 40px', 'padding:36px 44px 44px').replace('style="background:#ffffff;', 'style="background:#ffffff;border-radius:0 0 16px 16px;')}
${partners('In partnership with', '#666666', 'border-bottom:1px solid #e7e3d9;')}
${legal('#8a8478', '#8a6520')}
<tr><td align="center" style="padding:4px 0 8px;${F}font-size:13px;color:#322811;">Stay updated with bonds &amp; fixed income investments</td></tr>
<tr><td align="center" style="padding:6px 0 20px;"><span style="margin-left:-18px;display:inline-block;">${social('322811', 18)}</span></td></tr>`)
},
];

const $ = id => document.getElementById(id), f = $('f');
let cur = 0;
function show(i) {
  cur = i; const o = OPTIONS[i];
  [...$('tabs').children].forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  $('name').textContent = o.name; $('why').textContent = o.why; $('css').textContent = o.css;
  f.srcdoc = o.html();
  f.onload = () => { try { f.style.height = f.contentDocument.body.scrollHeight + 'px'; } catch {} };
}
OPTIONS.forEach((o, i) => { const b = document.createElement('button'); b.textContent = o.name; b.onclick = () => show(i); $('tabs').append(b); });
$('desk').onclick = () => { f.classList.remove('mobile'); $('desk').setAttribute('aria-pressed', true); $('mob').setAttribute('aria-pressed', false); f.onload(); };
$('mob').onclick = () => { f.classList.add('mobile'); $('mob').setAttribute('aria-pressed', true); $('desk').setAttribute('aria-pressed', false); setTimeout(f.onload, 300); };
$('copy').onclick = async () => { await navigator.clipboard.writeText(OPTIONS[cur].html()); $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy email HTML', 1500); };
Promise.all(SOCIAL.map(n => fetch(`https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/brand-${n}.svg`).then(r => r.text()).then(t => SVG[n] = t).catch(() => {}))).then(() => show(0));
</script>
</body>
</html>
