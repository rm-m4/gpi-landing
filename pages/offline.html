<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You’re offline | GoldenPi</title>
<!-- System state: a full-screen page with no nav or footer. Page CSS is the
     SYSTEM STATES block at the end of final.css; the illustration is inline. -->
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/goldenpi-logo.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/final.css">
</head>
<body>
<a class="gp-skip" href="#main-content">Skip to main content</a>

<main id="main-content" class="gp-state gp-state--offline">
  <div class="gp-state__body">
    <svg class="gp-state__art" viewBox="0 0 240 160" width="240" height="160" aria-hidden="true" focusable="false">
      <defs><linearGradient id="gp-state-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf2d0"/><stop offset=".5" stop-color="#e6b325"/><stop offset="1" stop-color="#b38600"/></linearGradient></defs>
      <g fill="none" stroke="#cfc8b8" stroke-width="7" stroke-linecap="round">
        <path class="gp-state__arc" style="--i:0" d="M98.1 90.1A31 31 0 0 1 141.9 90.1"/>
        <path class="gp-state__arc" style="--i:1" d="M83.2 75.2A52 52 0 0 1 156.8 75.2"/>
        <path class="gp-state__arc" style="--i:2" d="M68.4 60.4A73 73 0 0 1 171.6 60.4"/>
      </g>
      <circle cx="120" cy="112" r="8" fill="url(#gp-state-gold)"/>
      <path d="M76 36l92 100" stroke="#f7f5f2" stroke-width="13" stroke-linecap="round"/>
      <path d="M76 36l92 100" stroke="#322811" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h1 class="gp-state__title">You’re offline</h1>
    <p class="gp-state__text">Please check your internet connection and try again.</p>
    <button type="button" class="gp-cta gp-cta--primary" id="retry">Try again</button>
  </div>
</main>
<script>
  // Retry on demand, and on our own as soon as the connection is back.
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
