<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong | GoldenPi</title>
<!-- System state: a full-screen page with no nav or footer. Page CSS is the
     SYSTEM STATES block at the end of final.css; the illustration is inline. -->
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/goldenpi-logo.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/final.css">
</head>
<body>
<a class="gp-skip" href="#main-content">Skip to main content</a>

<main id="main-content" class="gp-state gp-state--error">
  <div class="gp-state__body">
    <svg class="gp-state__art" viewBox="0 0 240 160" width="240" height="160" aria-hidden="true" focusable="false">
      <defs><linearGradient id="gp-state-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf2d0"/><stop offset=".5" stop-color="#e6b325"/><stop offset="1" stop-color="#b38600"/></linearGradient></defs>
      <rect x="30" y="24" width="180" height="112" rx="14" fill="#fff" stroke="#e7e3d9"/>
      <path d="M46 56h148M46 82h148M46 108h148" stroke="#efeae0"/>
      <path class="gp-state__draw" pathLength="1" d="M46 112l32-18 26 6 30-30" fill="none" stroke="url(#gp-state-gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M158 84l14 10 22-34" fill="none" stroke="#cfc8b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8"/>
      <circle class="gp-state__ring" cx="144" cy="72" r="13" fill="none" stroke="#d4af37" stroke-width="2"/>
      <circle cx="144" cy="72" r="13" fill="#322811"/>
      <rect x="142.5" y="64.5" width="3" height="9" rx="1.5" fill="#fdf2d0"/>
      <circle cx="144" cy="78.5" r="1.8" fill="#fdf2d0"/>
    </svg>
    <h1 class="gp-state__title">Something went wrong</h1>
    <p class="gp-state__text">An unexpected error occurred. Please try again.</p>
    <button type="button" class="gp-cta gp-cta--primary" id="retry">Try again</button>
  </div>
</main>
<script>
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
</script>
</body>
</html>
