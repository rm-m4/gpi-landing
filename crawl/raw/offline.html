ce of third parties, or any reasons beyond the reasonable control of the Company."])</script><script>self.__next_f.push([1,"27:T589,"])</script><script>self.__next_f.push([1,"The credit rating by different rating agencies indicates the bond issuer's ability to repay its debt obligations. A bond can be rated by one or more SEBI registered credit rating agencies e.g. CRISIL, CARE, ICRA, IND, BWR, ACUITE, INFOMERICS. The rating can be any of these values (AAA, AA, A, BBB, BB, B, CCC, CC, C, D) where AAA indicates lowest risk and D indicates default by the issuer.\u003cbr\u003e\u003cbr\u003eRating outlook indicates a rating agency's perspective on the likely direction of credit rating migration in the medium term (typically 6 months to 2 years), hence it offers insights beyond the current rating itself. Common outlook categories include 'Positive', 'Negative', 'Stable', and sometimes 'Developing'. \u003cbr\u003e\u003cbr\u003ePositive Outlook suggests a higher probability of a rating upgrade in the medium term, reflecting favorable trends or events that strengthen the issuer's creditworthiness. \u003cbr\u003e\u003cbr\u003eStable Outlook suggests that the rating is unlikely to change significantly in the near to medium term, indicating a stable credit profile of the issuer. \u003cbr\u003e\u003cbr\u003eNegative Outlook indicates a higher likelihood of a rating downgrade, signaling potential weaknesses or adverse events that could weaken the issuer's credit position. \u003cbr\u003e\u003cbr\u003eDeveloping Outlook indicates that the rating could be either upgraded, downgraded, or remain the same, suggesting a less clear or uncertain outlook on the issuer's credit position."])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L13\",null,{\"formats\":\"$undefined\",\"locale\":\"en\",\"messages\":{\"common\":{\"skipToContent\":\"Skip to main content\",\"loginSignup\":\"Login / Sign up\",\"login\":\"Login\",\"signUp\":\"Sign up\",\"startInvesting\":\"Start Investing\",\"explor  platform to receive a debt broker licence under SEBI's OBPP framework. Today, investors can explore a wide range of fixed-income options on a single platform, including Corporate Bonds, Government Bonds, NCD IPOs, and Fixed Deposits.\",\"aboutP4\":\"More than 16 lakh users have registered with GoldenPi, investing over ₹5,512 crore through the platform with zero defaults to date. The company is further backed by Zerodha's Rainmatter, which strengthens the trust and credibility it has built among investors.\",\"needTitle\":\"As an Individual, What is the Need for You to Invest?\",\"needP1\":\"Investing means using a part of your money to buy assets, so that your money can grow over time. But why is it needed?\",\"needP2\":\"The money you earn from work usually has a limit. A salary can rise only up to a point, the hours you can work each week are fixed, and a business can take in only so much capital. Because of this, your income tends to stay more or less the same over time.\",\"needP3\":\"Your expenses, however, do not stay fixed. As you move forward in life, your responsibilities grow. You may need to buy a home, pay for your children's education, handle a medical emergency, or plan for retirement. All of these cost money, and often a large amount.\",\"needP4\":\"This is why investing is important. It gives you a second source of income that you can depend on. It also helps you set aside money on a regular basis. Over time, this builds strong financial habits.\",\"typesTitle\":\"What are the Different Types of Investments?\",\"typesP1\":\"There are many types of investments. But most of them fall into two main groups: Active Investments and Passive Investments.\",\"typesP2\":\"Active Investments need your time and effort. You must understand how the market works and stay closely involved. Passive Investments work in a different way. Here, you invest your money without being involved every day. The most common method is “buy and hold.” You buy the asset and keep it for a fixed period to earn the expected returns.\",\"typesP3\":\"Bonds and Debentures are good examples of safe and passive investments. You can invest in them and allow your money to grow over time, without watching the market daily.\",\"bondsTitle\":\"What are Bonds and Debentures?\",\"bondsP1\":\"Bonds are issued by government bodies. Debentures are issued by private companies, public sector units, banks, and NBFCs. Both are used to raise money. When you buy a Bond or a Debenture, you are lending money to the issuer. In return, the issuer pays you interest and returns your money on a fixed date. In simple terms, Bonds work much like loans. Both have a fixed maturity date. Based on the terms set at the time of issue, you earn interest at regular intervals.\",\"bondsP2\":\"Note: Please read all the terms and conditions of each instrument carefully before you invest, and always consider the market risks involved.\",\"bondTypesTitle\":\"What Are The Different Types Of Bonds and Debentures In India?\",\"bondTypesP1\":\"Here are some of the popular types of Bonds and Debentures available in India:\",\"bondType1\":\"Central Government Bonds\",\"bondType2\":\"State Government Bonds\",\"bondType3\":\"Municipal And Local Authority Bonds\",\"bondType4\":\"Corporate Bonds\",\"bondType5\":\"Public Sector Bonds\",\"bondType6\":\"Tax-Free Bonds\"}}},\"auth\":{\"emailOrPhone\":\"Email or mobile number\",\"emailOrPhonePlaceholder\":\"Enter Phone Number or Email\",\"emailOrPhonePlaceholderPage\":\"Enter Mobile Number/Email\",\"email\":\"Email\",\"name\":\"Full name\",\"completeProfileEmailLabel\":\"Enter your desired Email ID\",\"completeProfilePhoneLabel\":\"Enter your Aadhaar linked Phone Number\",\"completeProfileInProgress\":\"In Progress\",\"completeProfileError\":\"Unable to save your details. Please try again.\",\"verifyEmailTitle\":\"Verify Email\",\"verifyEmailDescription\":\"Secure your account with Email\",\"verifyEmailPlaceholder\":\"Enter Your Email\",\"verifyPhoneTi  course of any due diligence process.\u003c/span\u003e\"},{\"heading\":\"Consulting\",\"desc\":\"The Company may partner with another party to provide specific services if required. When you sign-up for the Services, the Company will share names, or other personal information such as email address or contact details that is necessary for the third party to provide these Services. The Company’s contractual arrangements with such third parties, restrict these parties from using personally identifiable information except for the explicit purpose of assisting in the provision of these Services.\"},{\"heading\":\"Exclusion\",\"desc\":\"$1a\"},{\"heading\":\"Data Retention\",\"desc\":\"$1b\"}]},{\"topic\":\"Third Party Content And Links To Third Party Services\",\"topicDesc\":\"The Website may contain content that is supplied by a third party, and those third parties may collect website usage information and your Device Identifier when web pages from any online or mobile services are provided to your browser. In addition, when you are using the Website, you may be directed to other sites or Websites that are operated and controlled by third parties that we do not control. We are not responsible for the privacy practices employed by any of these third parties. These other websites may send their own cookies to you, independently collect data or solicit personal information and may or may not have their own published privacy policies. When you leave our Website, we encourage you to read the privacy statements of all third party websites or Websites before submitting any information to third parties.\"},{\"topic\":\"Change of Information and Cancellation of Account\",\"topicDesc\":\"You are responsible for maintaining the accuracy of the information you submit to us, such as your contact information provided as part of account registration. If your Personal Information changes, or if you no longer desire to access the Website, you may correct, delete inaccuracies, or amend i ms of gold that are issued by the Reserve Bank of India (RBI) on behalf of the government. These bonds offer an alternative to holding physical gold by allowing investors to buy and hold gold in a digital form.\",\"faq2Title\":\"What are the benefits of investing in SGB over physical gold?\",\"faq2Body\":\"SGBs offer several benefits over physical gold, such as no storage cost, no making charges, and no purity issues. Additionally, SGBs offer a fixed interest rate of 2.5% per annum on the initial investment amount, providing an additional source of income for investors.\",\"faq3Title\":\"Who is eligible to invest in the SGBS?\",\"faq3Body\":\"Person's resident \u0026 Citizen of India are eligible to invest in SGB. Eligible investors include individuals, HUFS, trusts, universities, charitable institutions, etc.\",\"faq4Title\":\"Are there any risks in investing in SGBs?\",\"faq4Body\":\"There may be a risk of capital loss if the market price of gold declines. However, the investor does not lose in terms of the units of gold which he has paid for.\",\"faq5Title\":\"What is the minimum and maximum investment in Sovereign Gold Bonds?\",\"faq5Body\":\"The minimum investment in Sovereign Gold Bonds is 1 gram of gold, and the maximum investment limit for individuals and Hindu Undivided Families (HUFs) is 4 kg per financial year. For trusts and similar entities, the maximum investment limit is 20 kg per fiscal year.\",\"faq6Title\":\"What is the tenure of Sovereign Gold Bonds?\",\"faq6Body\":\"The tenure of Sovereign Gold Bonds is 8 years, but investors have the option to exit after 5 year. The bonds are also tradable on stock exchanges, allowing investors to exit before maturity.\",\"needHelpTitle\":\"Need Help\",\"needHelpDescription\":\"Talk to our Support Team for free. We will help you through your investment journey.\",\"needHelpButton\":\"Contact Us\",\"googleReviewsUrl\":\"https://www.google.com/search?q=goldenpi#lrd=0x3bae149adc349189:0xf8c3fe4924859a4e,1\"},\"governmentSecurities\":{\"seoTitle\":\"Government Securities - Invest Online in India | GoldenPi\",\"seoDescription\":\"Buy government bonds online. Government bonds are issued by the Indian government and state governments. These G-Sec Bonds are best suitable for investors with low-risk appetite and prefer safe investment\",\"breadcrumbAria\":\"Breadcrumb\",\"breadcrumbHome\":\"Home\",\"breadcrumbCurrent\":\"Government Securities\",\"heroTitleLine1\":\"Buy Government\",\"heroTitleLine2\":\"Securities Online\",\"heroBody\":\"Invest in Bonds guaranteed by The Government Of India, offering stable returns with lowest risk.\",\"heroCta\":\"Explore G-Sec Bonds\",\"heroTrustPrefix\":\"GoldenPi is a\",\"heroTrustHighlight\":\"SEBI registered Debt broker\",\"heroTrustSuffix\":\"and OBPP License Holder\",\"heroImageAlt\":\"A Smarter Choice Than FD. Start As Low As ₹100. Approx 7.5% Avg. Return.\",\"partnersLabel\":\"Trusted by leading brokers and Market leaders\",\"partnerAxisAlt\":\"Axis Securities\",\"partnerAnandRathiAlt\":\"Anand Rathi\",\"partnerSakthiAlt\":\"Sakthi Finance\",\"partnerCentrumAlt\":\"Centrum\",\"emptyTitle\":\"Currently there are no G-Secs available\",\"emptyInfo\":\"Click on 'Notify Me' to receive an update.\",\"emptyCta\":\"Notify Me\",\"emptyIconAlt\":\"Gsec no result\",\"bondsHeading\":\"Available Government Securities\",\"bondMetricYield\":\"Yield\",\"bondMetricRating\":\"Rating\",\"bondMetricPayments\":\"Payments\",\"bondMetricTenure\":\"Tenure\",\"bondWatchlistAdd\":\"Add to watchlist\",\"bondWatchlistRemove\":\"Remove from watchlist\",\"bondShare\":\"Share\",\"bondLogoAlt\":\"Issuer logo\",\"statementHeading\":\"Guaranteed by the Government to repay, Government Securities (G-Secs), also known as Sovereign Bonds, allow individuals to lend money in exchange for better interest rates, lower risk, and income stability.\",\"benefit1Title\":\"Risk-free\",\"benefit1Desc\":\"G-Secs are guaranteed by the GOI and have no credit risk\",\"benefit2Title\":\"Hassle-free Process\",\"benefit2Desc\":\"Easy and secure online journey under OBPP guidelines.\",\"benefit3Title\":\"No TDS\",\"benefit3Desc\":\"No tax deduction at source for interest payments received\",\"whatAreHeading\":\"What are Government Bonds?\",\"whatAreBody\":\"Earn better with stable, secure, and government-backed investment bonds. G-Secs are financial instruments issued by the government to raise funds. Investing in them means lending money to the government, getting interest payments and the invested amount back later.\",\"whatItMeans\":\"What it means?\",\"chipGsec\":\"G-Sec\",\"chipNbfc\":\"NBFC\",\"chipPayout\":\"Payout\",\"chipGsecTooltipTitle\":\"What is G-Sec?\",\"chipGsecTooltip\":\"G-sec is a tradeable instrument issued by the Central Government or the State Governments. It acknowledges the Government’s debt obligation.\",\"chipNbfcTooltipTitle\":\"What is NBFC?\",\"chipNbfcTooltip\":\"NBFC or Non-Banking Financial Company is a financial institution that offers various banking services but doesn’t have the banking license to accept demand deposits.\",\"chipPayoutTooltipTitle\":\"What is Payout?\",\"chipPayoutTooltip\":\"Payout disbursement of funds, profits, or dividends to investors or stakeholders.\",\"tooltipClose\":\"Close\",\"highlight1\":\"Regular and risk-free income\",\"highlight2\":\"Better than Bank FD\",\"highlight3\":\"Beats inflations\",\"highlight4\":\"No Default Risk\",\"howToHeading\":\"How to Invest in Government Bonds\",\"howToImageAlt\":\"How to invest in Government Bonds online\",\"step1Num\":\"01\",\"step1Title\":\"Complete your KYC\",\"step2Num\":\"02\",\"step2Title\":\"Choose the right Government Bond\",\"step3Num\":\"03\",\"step3Title\":\"Make payment to Invest\",\"milestonesLabel\":\"Milestones\",\"happyUsersHeading\":\"Why 15 Lakh+ Users Trust GoldenPi for Bond Investing\",\"happyUsersReadAll\":\"Read all Reviews\",\"happyUsersStarsAlt\":\"5 out of 5 stars\",\"googleReviewsUrl\":\"\",\"review1Name\":\"Phaniraj D G\",\"review1Text\":\"Hassle free investment. One place for all type of bonds. We can choose as per our risk. GoldenPi team is very co-operative and quick in responding.\",\"review2Name\":\"Neeraj Sharma\",\"review2Text\":\"Extremely convenient platform assisted with superb executives like I was always guided by Mr Allan with his experience and knowledge. Thank you so much Mr Allan.\",\"review3Name\":\"Reenu Jojy Mathew\",\"review3Text\":\"It is a seamless experience now for buying NCDs and Bonds with no hidden costs or service charges.\",\"review4Name\":\"Latha Abhimannue Thayyil\",\"review4Text\":\"The details explained by the personal manager was very helpful and useful. Response for each each call was immediate ,Proper guidance all make the profesional touch I wish them Best wishes.\",\"review5Name\":\"Harish Iyer\",\"review5Text\":\"Fantastic Team, superb website, unarguably the best website to buy bonds from. Regarding the Team: Every process is clearly explained, with patience and on time, and a person concerned would be assisting you throughout the buying process - right from choosing the bond to paying for the bond, \u0026 finally, getting the bond unit credited to the demat account.\",\"blogsHeading\":\"Learn about Investment in Government Bonds\",\"blogsCategory\":\"Government Securities\",\"viewAllBlogs\":\"View all Blogs\",\"viewAllBlogsHref\":\"https://goldenpi.com/blog\",\"faqHeading\":\"FAQs about Investment in Government Bonds\",\"faq1Title\":\"What does one mean by Government security?\",\"faq1Body\":\"\u003cp\u003eGovernment bonds/ security (G-Sec) means a security created and issued by the Central and State Governments for the purpose of raising a public loan or mainly for capital expenditure, financing a budget deficit, or infrastructure development as notified by the Government in the Official Gazette.\u003c/p\u003e\u003cp\u003eGovernment securities offer the benefits of safety, liquidity, and attractive returns to institutional or non-institutional investors, individuals, and non-individuals.\u003c/p\u003e\u003cp\u003eG-Secs are available to invest usually in a range from 91 days to 40 years.\u003c/p\u003e\",\"faq2Title\":\"Are Government bonds good investment?\",\"faq2Body\":\"\u003cp\u003eGovernment Securities (G-Secs) are highly secure debt instruments backed by the sovereign guarantee of the Government of India, making them practically free of default risk.\u003c/p\u003e\u003cp\u003e\u003cb\u003eWhy it matters\u003c/b\u003e\u003c/p\u003e\u003cp\u003eIssued by the Reserve Bank of India (RBI) on behalf of the government, these instruments are primarily suited for capital preservation and generating predictable interest income rather than high, market-beating returns. This structural safety makes G-Secs an excellent fit for conservative, long-horizon investors planning for retirement or seeking defensive capital protection. However, while credit default risk is practically absent, their secondary market prices will still fluctuate on the exchanges with interest-rate movements, which can impact your capital if you sell before maturity.\u003c/p\u003e\",\"faq3Title\":\"How to buy Government bonds through GoldenPi?\",\"faq3Body\":\"\u003cp\u003eInvestors can easily invest in Government bonds on GoldenPi in just two steps:\u003cbr\u003eStep 1: Complete your KYC and ensure it is KRA validated.\u003cbr\u003eStep 2: Place your order and transfer funds online directly to the clearing corporation’s settlement account.\u003cbr\u003eOnce the transaction is confirmed, the government bond units are credited to your Demat account on a T+2 settlement basis as per exchange guidelines\u003c/p\u003e\",\"faq4Title\":\"Are Government bonds tax-free?\",\"faq4Body\":\"\u003cp\u003eThe interest earned by the G-Secs/SDLs is taxable and is taxed under the relevant tax slab of the bondholder as per the current tax norms.\u003cbr\u003eDisclaimer: However request you to consult the tax consultant before investing.\u003c/p\u003e\u003cp\u003eFor more details on taxation, please read \u003ca class=\\\"underline\\\" href=\\\"https://goldenpi.com/faq/taxation-on-returns\\\"\u003eclick here\u003c/a\u003e\u003c/p\u003e\",\"faq5Title\":\"Can NRI Invest in Government bonds?\",\"faq5Body\":\"\u003cp\u003eNon-Resident Indians (NRIs) and Overseas Citizens of India (OCI) are both eligible to subscribe to government bonds in the form of new or re-issuance when the securities are issued. The NRIs can invest in G-Secs through Non PIS NRO account which is non-repatriable in nature to buy G-Secs or SDLs. You can buy or sell government bonds in the secondary market. For buying and selling assistance you can contact your relationship manager at GoldenPi.\u003c/p\u003e\",\"faq6Title\":\"How to sell Government Bonds?\",\"faq6Body\":\"\u003cp\u003eYou can sell your Government Securities (G-Secs) on the stock exchange prior to maturity through your demat account, providing a pathway for secondary market liquidity.\u003c/p\u003e\u003cp\u003e\u003cb\u003eHow it works\u003c/b\u003e\u003c/p\u003e\u003cp\u003eOn Indian stock exchanges, G-Secs are listed and tradable debt instruments. When you sell before maturity, the transaction is executed through your broker, and the sale price is determined by the prevailing market yields and interest rates rather than the bond's original face value. Once the trade is executed, settlement is completed on the exchange (typically on a T+1 basis), and the proceeds are directly credited to your linked primary bank account within the settlement period.\u003c/p\u003e\",\"faq7Title\":\"What is the minimum investment in the government security bonds in 2026?\",\"faq7Body\":\"\u003cp\u003eThe minimum investment for Government Securities (G-Secs) on GoldenPi is typically ₹10,000 face value, which represents one unit of the underlying sovereign debt.\u003c/p\u003e\u003cp\u003eExample: If you purchase a G-Sec with a face value of ₹10,000, you can scale your investment higher in multiples of this same denomination. This low entry barrier contrasts with corporate bonds, which often require minimums of ₹100,000. Depending on market yields and interest rates, the actual purchase price of these sovereign instruments may trade at a premium or discount to face value.\u003c/p\u003e\",\"needHelpTitle\":\"Need Help\",\"needHelpDescription\":\"Talk to our Support Team for free. We will help you through your investment journey.\",\"needHelpButton\":\"Contact Us\"},\"corporateBonds\":{\"seoTitle\":\"Invest in Corporate Bonds Online | Fixed Returns | GoldenPi\",\"seoDescription\":\"Invest in corporate bonds online on GoldenPi. Explore curated collections, high-rated bonds, NCD IPOs and start with returns as high as 15%.\",\"breadcrumbHome\":\"Home\",\"breadcrumbCurrent\":\"Corporate Bonds\",\"breadcrumbAria\":\"Breadcrumb\",\"heroEyebrow\":\"Fixed income · SEBI regulated\",\"heroTitleAccent\":\"Invest in Corporate\",\"heroTitle\":\"Bonds Online\",\"heroSubtitle\":\"Fixed returns as high as \u003chighlight\u003e{maxInterest}%\u003c/highlight\u003e\",\"heroBody\":\"Discover reliable income and stable capital growth with Corporate Bond Investments.\",\"heroCta\":\"Explore Corporate Bonds\",\"heroSecondaryCta\":\"View NCD IPOs\",\"heroImageAlt\":\"Invest in corporate bonds online on GoldenPi\",\"promoBannerAlt\":\"Bond Utsav offers on GoldenPi\",\"assetsHeading\":\"Fixed Income Investments in India 2026\",\"assetsSubheading\":\"Explore our curated selection of investment solutions to shortlist options that match your goals.\",\"collectionsHeading\":\"Explore our extensive Corporate Bonds Collections\",\"collectionsViewAll\":\"View all Bond Collections\",\"whatIsHeading\":\"What are Corporate Bonds?\",\"whatIsBody1\":\"Corporate Bonds are debt securities regulated by SEBI and issued by corporations to raise capital from investors.\",\"whatIsBody2\":\"These bonds offer higher yields compared to other fixed income securities, offering relatively attractive returns to investors.\",\"whatI
